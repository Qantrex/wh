# Template: parts and accessories for my KTM 390 Duke 2024 (gen 3, 399 cc). Used by the Duke-390-* buy notes in
# ~/Notes/Marketplace/Buying (`wh-profile: duke-390-2024`). What to buy and why is in ~/Notes/Bike/Mods.md and
# Bike/Exhaust.md; this only filters and ranks ads. Format: see the header of sport-gloves.toml.

about = "Parts for my 390 Duke 2024 from Bike/Mods.md (2024+ fitment, road-legal)"

[[junk]]
reason = "for the 2013–2023 Duke (doesn't fit the 2024)"
title = 'duke|390|ktm'
text = '\b20(?:1[3-9]|2[0-3])\b'
unless = '\b202[4-6]\b|ab\s*(?:bj\.?\s*|baujahr\s*)?(?:20)?24\b|gen\s*3|3\.\s*gen|\bmy\s*2[4-6]\b|399\s*cc'

[[junk]]
reason = "for another model"
title = '\b(?:125|200|250|690|790|890|990|1290|1390|rc\s*\d+|adventure|adv|smc|enduro|svartpilen|vitpilen|husqvarna)\b'
unless = '\b390\b'

[[junk]]
reason = "for another 390 model (Adventure, RC, SMC …)"
title = '\b(?:adventure|adv|rc|smc|enduro|svartpilen|vitpilen)\b'
