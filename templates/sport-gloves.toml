# Template: leather sport gauntlets for the road. Used by ~/Notes/Marketplace/Buying/Motorcycle-Gloves.md
# (`wh-profile: sport-gloves`). Copy this file to start a new template; the file name is the profile name.
#
# How a template works (all patterns are Python regexes, case-insensitive, on lowercased text; 'single quotes'
# keep backslashes as they are). "title" is the ad's title, "text" is title + description + full ad if fetched.
#   [[junk]]    the ad is junk when every pattern it gives (title, text) matches, unless `unless` matches the text
#   [[require]] the ad is junk when its patterns do NOT all match
#   [[field]]   a column: the first value whose `match` hits is shown (`value`, may use \1; default the match);
#               its `score` adds to the ad's score, `new` (a new price in €) adds a "new €X (−Y %)" column
#   [shortlist] `min_score` drops lower-scored ads; `sort` keys: score, below_new, price, published (- = highest
#               first; default ["-score", "-below_new", "price"])
#   category    willhaben category the ads belong in; the sweep warns when a search mostly lands outside it
# Test changes with: wh search --url '<search URL>' --profile sport-gloves --all --json   (shows junk + score)
# and `wh profiles`, which lists broken templates with the reason.

about = "Leather sport gauntlets for the road"
category = "motorradbekleidung/handschuhe-6363"

[[junk]]
reason = "women's glove (shorter fingers)"
title = '\b(?:damen|lady|ladies|women|woman|frauen|stella)\b'

[[junk]]
reason = "kids' glove"
title = '\b(?:kinder|kids?|jugend|youth|junior)\b'

[[junk]]
reason = "off-road glove (little armour)"
title = '\b(?:mx|motocross|moto-?x|cross|enduro|off-?road|mtb|bmx|downhill|trial)\b'

[[junk]]
reason = "not a motorcycle glove"
title = '\b(?:fahrrad\w*|radhandschuh\w*|ski|snowboard|golf|arbeits\w*|garten\w*|sim-?racing|kart\w*|fitness|reithandschuh\w*|boxhandschuh\w*)\b'

[[junk]]
reason = "short, urban or vintage glove"
title = '\b(?:kurz\w*|short|sommerhandschuh\w*|smx|sp\s*-?\s*x|urban|city|mesh|vintage|retro|cafe\s*racer|custom|chopper|harley)\b'
unless = '\bstulpe|gauntlet|\blang\b|\blong\b'

[[junk]]
reason = "winter, rain, heated or textile glove"
title = '\b(?:winter\w*|thermo\w*|beheiz\w*|heiz\w*|gore-?tex|goretex|gtx|drystar|wasserdicht\w*|regen\w*|h2o|waterproof|textil\w*|softshell)\b'

[[junk]]
reason = "damage or a crash mentioned"
text = '\bmit loch\b|\blöcher\b|\bloch\b|\briss(?:e|en)?\b|gerissen|repariert|reparatur\w*|sturzschaden|nach (?:einem |dem )?sturz|klett hält nicht'
unless = 'sturzfrei|unfallfrei|kein\w*\s+(?:[\w-]+\s+){0,3}(?:loch|löcher|risse?|sturz|stürze|reparatur\w*|beschädigung\w*|schaden)'

[[require]]
reason = "no sign of a sport gauntlet"
text = '\bstulpe|gauntlet|\blang\b|\blong\b|racing|\brace\b|\brenn\w*|sport\w*|track|\bgp\b|gp\s*-?\s*(?:pro|plus|tech)|sp\s*-?\s*\d|carbon|phantom|\btitan\b|druid|steel\s*-?\s*pro|full\s*metal|jerez|chicane|\brfx|känguru|kangaroo|knöchel\w*|protektor\w*|level\s*[12]'

# Model: race gloves score higher. Level 2 is confirmed only where noted; new prices are typical shop prices
# on 2026-10-30 (sources in the Motorcycle-Gloves note).
[[field]]
name = "model"
values = [
  { match = 'gp\s*-?\s*pro\s*-?\s*r\s*3', value = "GP Pro R3", score = 4, new = 200 },  # Level 2 KP; outlet €199.95, RRP €289.95
  { match = 'gp\s*-?\s*pro\s*-?\s*r\s*s?\s*4', value = "GP Pro R4", score = 4 },
  { match = 'gp\s*-?\s*tech\s*v\s*2', value = "GP Tech v2", score = 4 },               # Level 2 KP (alpinestars.com)
  { match = 'gp\s*-?\s*pro', value = "GP Pro (R2/R3?)", score = 3 },
  { match = 'gp\s*-?\s*tech', value = "GP Tech", score = 3 },
  { match = 'gp\s*-?\s*plus\s*-?\s*r\s*v\s*2', value = "GP Plus R v2", score = 2, new = 200 },  # Level 1 KP; RRP £199.99
  { match = 'gp\s*-?\s*plus\s*-?\s*r\s*2', value = "GP Plus R2", score = 2 },          # the older model
  { match = 'gp\s*-?\s*plus', value = "GP Plus", score = 2 },
  { match = 'sp\s*-?\s*8', value = "SP-8", score = 2, new = 110 },                     # Level 1 KP; €95–120 new
  { match = 'sp\s*-?\s*2', value = "SP-2", score = 2 },
  { match = 'phantom', value = "Held Phantom", score = 3 },
  { match = 'held\W+(?:\w+\W+){0,2}titan|titan\s*rr', value = "Held Titan", score = 2 },
  { match = 'evo\s*-?\s*thrux', value = "Held Evo-Thrux", score = 2 },
  { match = 'steel\s*-?\s*pro', value = "Dainese Steel-Pro", score = 3 },
  { match = 'full\s*metal', value = "Dainese Full Metal", score = 3 },
  { match = 'druid\s*4', value = "Dainese Druid 4", score = 2, new = 229 },           # Level 1; RRP €229
  { match = 'druid', value = "Dainese Druid", score = 2 },
  { match = 'carbon\s*[34]\s*long', value = "Dainese Carbon Long", score = 2, new = 150 },  # Level 1; €108–180 new
  { match = 'jerez', value = "Rev'it Jerez", score = 2 },
  { match = 'chicane', value = "Rev'it Chicane", score = 2 },
  { match = '\brfx', value = "Five RFX", score = 2 },
  { match = 'r\s*-?\s*safe', value = "Racer R-Safe", score = 1 },
  { match = 'prx\s*-?\s*1\d', value = "Probiker PRX", score = 1 },
]

[[field]]
name = "ce"
values = [
  { match = 'level\s*2|lev\.?\s*2|kp\s*2|stufe\s*2', value = "CE Level 2", score = 2 },
  { match = 'level\s*1|lev\.?\s*1|kp\s*1|stufe\s*1', value = "CE Level 1" },
]

[[field]]
name = "palm"
values = [{ match = 'känguru|kangaroo', value = "kangaroo", score = 1 }]

[[field]]
name = "crash"
values = [{ match = 'sturzfrei|unfallfrei|nie gestürzt|kein\w*\s+sturz', value = "crash-free", score = 1 }]

[[field]]
name = "condition"
values = [
  { match = '\bneu\b|ungetragen|unbenutzt|neuwertig|nie getragen|\b(?:[1-9]|ein|zwei|drei)\s*(?:mal|x)\s*(?:getragen|benutzt|verwendet)', value = "as new", score = 1 },
]

[shortlist]
min_score = 2
