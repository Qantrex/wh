name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (offline)
        run: python -W error::ResourceWarning test_wh.py -v
      - name: wh starts and its doctor passes
        run: |
          mkdir -p "$RUNNER_TEMP/notes"
          ./wh --help > /dev/null
          WH_NOTES="$RUNNER_TEMP/notes" WH_DB="$RUNNER_TEMP/wh.db" ./wh doctor
